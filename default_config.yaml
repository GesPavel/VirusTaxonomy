experiment:
  name: "default_run"
  parent_experiment_name:
  description: "Default settings: sigmoid calibration, best-hit aggregation, 15% FPR budget"
  random_seed: 42
  # Relative to the directory you run from, i.e. the project root. One
  # subdirectory is created per run.
  output_root: "experiments"

data:
  # Relative to the project root. Expected layout:
  #   data/<taxon_rank>/scenario<chosen_scenario>/pkl_ext/train.pkl
  #                                              /pkl_ext/test.pkl
  # The rank and scenario below must match the folders actually present.
  data_root: "data"
  chosen_scenario: 4                # 1 | 2 | 3 | 4 | all
  representation: "hmm"        # hmm | pc | hybrid
  taxon_rank: "Order"          # Family | Genus | Order | ...

split:
  calibration_fraction: 0.15
  novelty_fit_fraction: 0.15

pair_generation:
  # Per genome: up to k_pos same-taxon partners, ceil(k_pos/2) hard (most
  # similar) wrong-taxon negatives and floor(k_pos/2) random ones.
  k_pos: 10

features:
  use_intersection: true
  use_jaccard: true
  use_len1: true
  use_len2: true
  use_abs_len_diff: true

model:
  type: "logreg"              # logreg | xgboost

  logreg:
    max_iter: 1000
    C: 1.0
    solver: "lbfgs"

  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "logloss"

calibration:
  # Sigmoid keeps the score continuous. Isotonic is a step function whose few
  # output levels collapse the score resolution -- measured at 34 usable
  # thresholds against sigmoid's 1253 on the same data.
  method: "sigmoid"           # sigmoid | isotonic

aggregation:
  method: "logit_sum"         # mean | median | max | logit_sum | topk_mean
  # Best-hit only. Summing more matches per taxon adds noise rather than
  # evidence: measured monotone losses in both assignment (Family s4 top-1
  # 0.9456 -> 0.8565 at topk 10) and novelty recall (s3 0.9284 -> 0.6157).
  # NOTE: more than one value here makes the novelty threshold meaningless --
  # the ROC would be built across mixed score scales. Keep it to a single value.
  topk_values: [ 1 ]          # null = use all

novelty:
  use_normalized_probabilities: false

  # Operating points recorded for each of these budgets, so the detection-rate
  # / false-alarm trade-off is readable without refitting.
  reported_fpr_budgets: [0.05, 0.10, 0.15, 0.20]

  # The budget whose threshold is handed to the evaluation stage. 5% leaves most
  # of the detection rate unused at fine ranks -- at Genus it costs five sixths
  # of the TPR for no precision gain.
  primary_fpr_budget: 0.15

  # Fallback ladder, only consulted when the primary budget admits no usable
  # operating point.
  max_fpr_budgets: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50, 0.75, 1.0]
